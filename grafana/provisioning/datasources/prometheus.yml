apiVersion: 1

datasources:
  # Provision the source declaratively so every local environment has the
  # same Prometheus connection without manual UI configuration.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

# Grafana runs in a container too, so it uses Docker's internal service DNS
# rather than the host-machine localhost address.
